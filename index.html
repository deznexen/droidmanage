<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Droid Tycoon Rebirth Tracker</title>
<style>
:root{
--bg:#0d1117;
--panel:#161b22;
--panel2:#1c2230;
--border:#2a3140;
--text:#e6edf3;
--muted:#8b96a5;
--accent:#4fc3f7;
--gold:#f2c14e;
--diamond:#7fdbff;
--rainbow:#ff6ec7;
--beskar:#c0c0c0;
--galactic:#a78bfa;
--stellar:#38bdf8;
--base:#9fd88a;
--good:#3fb950;
--bad:#f85149;
}
*{box-sizing:border-box;}
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
background:radial-gradient(circle at top left,#111a2b,#0a0e14 60%);
color:var(--text);
padding:20px;
}
h1{font-size:1.4rem;margin:0 0 4px 0;letter-spacing:.5px;}
.subtitle{color:var(--muted);font-size:.85rem;margin-bottom:14px;}
.path-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.path-tab{
padding:8px 18px;
border-radius:8px;
border:1px solid var(--border);
background:var(--panel2);
color:var(--muted);
cursor:pointer;
font-weight:600;
font-size:.9rem;
}
.path-tab.active{
background:linear-gradient(135deg,#1a2540,#111827);
border-color:var(--accent);
color:var(--accent);
}
.lang-tabs{display:flex;gap:8px;margin-bottom:14px;}
.lang-tab{
padding:6px 14px;border-radius:8px;border:1px solid var(--border);
background:var(--panel2);color:var(--muted);cursor:pointer;font-weight:600;font-size:.8rem;
}
.lang-tab.active{border-color:var(--accent);color:var(--accent);}
.path-note{font-size:.75rem;color:var(--muted);margin:-8px 0 14px 0;}
.compact-toggle{
background:var(--panel2);border:1px solid var(--border);color:var(--text);
border-radius:8px;padding:8px 14px;font-size:.85rem;cursor:pointer;
margin-bottom:14px;font-weight:600;
}
.compact-toggle.active{border-color:var(--accent);color:var(--accent);}
body.compact .hide-in-compact{display:none;}
body.compact .layout{grid-template-columns:1fr;}
body.compact .now-box{
position:sticky;top:12px;z-index:5;
box-shadow:0 8px 24px rgba(0,0,0,.5);
}
body.compact .lvl{font-size:2rem;}
body.compact .need-chip{font-size:1rem;padding:8px 12px;}
body.compact .tier-tag{font-size:.85rem;padding:2px 8px;}
body.compact h1{font-size:1.1rem;}
body.compact .subtitle, body.compact .footnote{display:none;}
.layout{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start;}
@media (max-width:900px){.layout{grid-template-columns:1fr;}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;}
.panel h2{font-size:1rem;margin:0 0 12px 0;color:var(--accent);}
.now-box{
background:linear-gradient(135deg,#1a2540,#111827);
border:1px solid #2f4a7a;
border-radius:12px;
padding:16px;
margin-bottom:16px;
}
.now-box .lvl{font-size:1.6rem;font-weight:700;}
.now-box .credits{color:var(--gold);font-weight:600;}
.need-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.need-chip{
padding:6px 10px;border-radius:8px;font-size:.85rem;
border:1px solid var(--border);display:flex;align-items:center;gap:6px;
}
.need-chip.ok{border-color:var(--good);background:rgba(63,185,80,.12);}
.need-chip.missing{border-color:var(--bad);background:rgba(248,81,73,.12);}
.tier-tag{font-size:.7rem;font-weight:700;padding:1px 6px;border-radius:5px;color:#0d1117;}
.tier-0{background:#3a4150;color:var(--muted);}
.tier-1{background:var(--base);}
.tier-2{background:var(--gold);}
.tier-3{background:var(--diamond);}
.tier-4{background:var(--rainbow);}
.tier-5{background:var(--beskar);}
.tier-6{background:var(--galactic);}
.tier-7{background:var(--stellar);}
.rarity-badge{
font-size:.65rem;font-weight:700;padding:1px 5px;border-radius:4px;
border:1px solid; letter-spacing:.3px;
}
.rarity-common{color:#c9d1d9;border-color:#4a5568;background:rgba(255,255,255,.04);}
.rarity-rare{color:#4fc3f7;border-color:#2f80a3;background:rgba(79,195,247,.08);}
.rarity-epic{color:#c084fc;border-color:#7e3fb0;background:rgba(192,132,252,.1);}
.rarity-legendary{color:#f2c14e;border-color:#a8791f;background:rgba(242,193,78,.1);}
.rarity-mythic{color:#ff6ec7;border-color:#b0397f;background:rgba(255,110,199,.1);}
.rarity-unknown{color:#6b7280;border-color:#3a4150;background:rgba(255,255,255,.02);}
.inv-search{
width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);
background:var(--panel2);color:var(--text);margin-bottom:10px;font-size:.85rem;
}
.inv-row{
display:flex;justify-content:space-between;align-items:center;
padding:6px 4px;border-bottom:1px solid var(--border);gap:8px;
}
.inv-row:last-child{border-bottom:none;}
.inv-row label{font-size:.8rem;}
select{
background:var(--panel2);color:var(--text);border:1px solid var(--border);
border-radius:6px;padding:4px 6px;font-size:.78rem;
}
.progress-bar-wrap{background:var(--panel2);border-radius:8px;height:8px;overflow:hidden;margin:10px 0 4px 0;}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--good));}
.rebirth-list{display:flex;flex-direction:column;gap:8px;max-height:78vh;overflow-y:auto;padding-right:4px;}
.rebirth-card{
border:1px solid var(--border);border-radius:10px;padding:10px 12px;
background:var(--panel2);display:flex;justify-content:space-between;
align-items:center;gap:12px;flex-wrap:wrap;
}
.rebirth-card.done{opacity:.55;}
.rebirth-card.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:#132133;}
.rb-left{display:flex;align-items:center;gap:10px;min-width:70px;}
.rb-num{
font-weight:700;font-size:.85rem;min-width:52px;height:34px;border-radius:17px;
display:flex;align-items:center;justify-content:center;background:#232b3a;flex-shrink:0;padding:0 6px;
}
.rebirth-card.done .rb-num{background:var(--good);color:#0d1117;}
.rebirth-card.current .rb-num{background:var(--accent);color:#0d1117;}
.rb-credits{color:var(--gold);font-size:.8rem;font-weight:600;min-width:70px;}
.rb-droids{display:flex;gap:6px;flex-wrap:wrap;flex:1;}
.status-icon{font-size:.8rem;margin-left:2px;}
.reuse-star{color:var(--rainbow);font-weight:700;margin-left:2px;}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-top:10px;}
.reset-btn{
background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;
padding:6px 10px;font-size:.75rem;cursor:pointer;margin-top:12px;
}
.reset-btn:hover{border-color:var(--bad);color:var(--bad);}
.save-note{font-size:.7rem;color:var(--muted);margin-top:8px;}
.footnote{font-size:.75rem;color:var(--muted);margin-top:16px;line-height:1.4;}
.spawn-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.spawn-chip{
background:var(--panel2);border:1px solid var(--border);border-radius:10px;
padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:.8rem;
}
.spawn-chip .spawn-icon{font-size:1.1rem;}
.spawn-chip .spawn-time{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;}
.spawn-chip .spawn-label{color:var(--muted);}
.reward-chip{
padding:2px 6px;border-radius:6px;font-size:.65rem;font-weight:700;
border:1px solid #6b4fc9;color:#c4b5fd;background:rgba(167,139,250,.1);
}
</style>
</head>
<body>

<h1 id="txtTitle">🤖 Star Wars Droid Tycoon — Rebirth Tracker</h1>
<div class="subtitle" id="txtSubtitle"></div>

<div class="lang-tabs">
<button class="lang-tab active" id="langEl">Ελληνικά</button>
<button class="lang-tab" id="langEn">English</button>
</div>

<div class="spawn-bar" id="spawnBar">
<div class="spawn-chip">🟠 <span class="spawn-label" id="spawnBeskarLabel"></span> <span class="spawn-time" id="spawnBeskarTime">--:--</span></div>
<div class="spawn-chip">🔴 <span class="spawn-label" id="spawnMythicLabel"></span> <span class="spawn-time" id="spawnMythicTime">--:--</span></div>
<div class="spawn-chip">🟣 <span class="spawn-label" id="spawnGalacticLabel"></span> <span class="spawn-time" id="spawnGalacticTime">--:--</span></div>
</div>

<div class="path-tabs">
<button class="path-tab" id="tabPath1">Path 1</button>
<button class="path-tab" id="tabPath2">Path 2</button>
<button class="path-tab active" id="tabPath3">Path 3</button>
<button class="path-tab" id="tabPath4">Path 4</button>
<button class="path-tab" id="tabPath5">Path 5</button>
</div>
<div class="path-note" id="txtPathNote"></div>
<button class="compact-toggle" id="compactToggle"></button>
<button class="reset-btn" id="superRebirthBtn" style="border-color:var(--rainbow);color:var(--rainbow);font-weight:700;padding:10px 16px;margin-bottom:16px;"></button>
<button class="reset-btn" id="feedbackBtn" style="border-color:var(--accent);color:var(--accent);margin-left:8px;padding:10px 16px;margin-bottom:16px;"></button>

<div id="feedbackModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:60;">
<div style="background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;width:340px;max-width:90vw;">
<h3 id="txtFeedbackTitle" style="margin:0 0 10px 0;font-size:.95rem;color:var(--accent);"></h3>
<textarea id="feedbackText" rows="5" style="width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;font-size:.85rem;font-family:inherit;resize:vertical;"></textarea>
<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap;">
<button id="feedbackCancelBtn" class="reset-btn" style="margin:0;"></button>
<button id="feedbackCopyBtn" class="reset-btn" style="margin:0;"></button>
<button id="feedbackSendBtn" class="reset-btn" style="margin:0;border-color:var(--accent);color:var(--accent);"></button>
</div>
<div id="feedbackNote" class="save-note" style="margin-top:8px;"></div>
</div>
</div>

<div class="layout">

<div class="hide-in-compact">
<div class="panel">
<h2 id="txtInventoryTitle"></h2>
<input type="text" class="inv-search" id="search">
<div id="inventoryList"></div>
<button class="reset-btn" id="resetBtn"></button>
<div class="save-note" id="saveNote"></div>
</div>
</div>

<div>
<div class="now-box">
<div class="subtitle" style="margin-bottom:6px;"><span id="txtNextGoal"></span> (<span id="pathLabel">Path 3</span>)</div>
<div class="lvl" id="currentLevel">—</div>
<div class="credits" id="currentCredits">—</div>
<div class="need-list" id="currentNeeds"></div>
<div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
<div class="save-note" id="progressText"></div>
</div>

<div class="panel" id="dealPanel">
<h2 id="txtDealTitle"></h2>
<div id="dealContent" class="save-note" style="margin-top:0;"></div>
<button class="reset-btn" id="reportDealBtn" style="margin-top:10px;"></button>
</div>

<div class="panel" id="sellPanel">
<h2 id="txtSellTitle"></h2>
<div class="save-note" style="margin-top:0;margin-bottom:8px;" id="txtSellDesc"></div>
<div id="sellList" class="need-list"></div>
</div>

<div class="panel">
<h2 id="txtRebirthsTitle"></h2>
<div class="legend">
<span id="txtLegendCheck"></span>
<span id="txtLegendDone"></span>
<span id="txtLegendNext"></span>
<span id="txtLegendTier"></span>
<span style="color:var(--rainbow);" id="txtLegendReuse"></span>
</div>
<div class="rebirth-list" id="rebirthList" style="margin-top:10px;"></div>
</div>
</div>

</div>

<div class="footnote" id="txtFootnote"></div>

<script>
let lang = 'el';

const TRANSLATIONS = {

legendReuse: "★ = ξαναχρειάζεται σε επόμενο rebirth — μην το πουλήσεις",
footnote: `Δεδομένα Path 1–5 (Rebirth 1–35 σε κάθε path, με το νέο STELLAR tier από το Rebirth 31+). Το ★ δείχνει droids που χρειάζονται ξανά σε επόμενο rebirth level στο ίδιο path — καλό είναι να μην τα πουλήσεις πρόωρα.<br>Το χρωματιστό label δίπλα σε κάθε droid (Common/Rare/Epic/Legendary/Mythic) δείχνει τη rarity του, από τον επίσημο πίνακα Droidex.<br>Τα 💎 Nova Crystals και τα ποσοστά credit/XP multiplier ανά rebirth (από RB12+) είναι από το community "RBC Check Sheet" (credit: starscurse) — πέρασε πάνω από το 💎 badge για λεπτομέρειες.<br>Οι χρόνοι spawn (Beskar/Mythic/Galactic) είναι υπολογισμένοι με βάση την τοπική ώρα του browser σου· αν το παιχνίδι χρησιμοποιεί διαφορετική ζώνη ώρας server, μπορεί να διαφέρουν ελαφρώς.<br>Το «Τρέχον Limited Deal» δείχνει το πιο πρόσφατο comment από όσους το αναφέρουν — δεν διαβάζεται αυτόματα από το παιχνίδι, κάποιος πρέπει να το δει και να το γράψει. Πάτα "📢 Ανέφερε το τρέχον deal" αν το ξέρεις.<br>Επειδή η βάση σου έχει όριο στο πόσα droids μπορείς να έχεις ταυτόχρονα, η πρόοδος/επόμενος στόχος υπολογίζεται από το checkbox που τσεκάρεις εσύ σε κάθε rebirth ("το έχω κάνει"), όχι αυτόματα από το inventory. Το inventory panel και τα ✅/❌ δίπλα σε κάθε droid μένουν σαν βοήθημα.`,

function t(key){ return TRANSLATIONS[lang][key]; }

const TIER_LABELS = {
el: ["Καμία","Base","Gold","Diamond","Rainbow","Beskar","Galactic","Stellar"],
en: ["None","Base","Gold","Diamond","Rainbow","Beskar","Galactic","Stellar"]
};
let TIERS = TIER_LABELS[lang];
const TIER_CLASS = ["tier-0","tier-1","tier-2","tier-3","tier-4","tier-5","tier-6","tier-7"];

// Rarity confirmed from the official Droidex table (canonical English values).

// Super Rebirth Cycle rewards per rebirth level (Nova Crystals + Credit/XP multipliers),
// from the community-maintained "RBC Check Sheet" (credit: starscurse). Same across paths —
// only levels 12+ grant crystals per the sheet.
const REWARDS = {
12:{crystals:11, credit:22, xp:110}, 13:{crystals:16, credit:32, xp:160},
14:{crystals:22, credit:44, xp:220}, 15:{crystals:29, credit:58, xp:290},
16:{crystals:37, credit:74, xp:370}, 17:{crystals:46, credit:92, xp:460},
18:{crystals:56, credit:112, xp:560}, 19:{crystals:67, credit:134, xp:670},
20:{crystals:79, credit:158, xp:790}, 21:{crystals:92, credit:184, xp:920},
22:{crystals:106, credit:212, xp:1060}, 23:{crystals:121, credit:242, xp:1210},
24:{crystals:137, credit:274, xp:1370}, 25:{crystals:154, credit:308, xp:1540},
26:{crystals:172, credit:344, xp:1720}, 27:{crystals:191, credit:382, xp:1910},
28:{crystals:211, credit:422, xp:2110}, 29:{crystals:232, credit:464, xp:2320},
30:{crystals:254, credit:508, xp:2540},
};
function rewardBadge(level){
const r = REWARDS[level];
if(!r) return '';
return `<span class="reward-chip" title="${t('rewardTooltip')(r.crystals, r.credit, r.xp)}">💎${r.crystals}</span>`;
}

const PATHS = {1: PATH1, 2: PATH2, 3: PATH3, 4: PATH4, 5: PATH5};
let currentPath = 3;

const droidSet = new Set();
[PATH1, PATH2, PATH3, PATH4].forEach(p => p.forEach(rb => rb.droids.forEach(([name]) => droidSet.add(name))));
const droidNames = Array.from(droidSet).sort((a,b)=>a.localeCompare(b));

let inventory = {};
let completedLevels = {}; // key "path-level" -> true
let saveTimeout = null;

async function loadInventory(){
try{
const v = localStorage.getItem('droid-tycoon-inventory-p34');
if(v){ inventory = JSON.parse(v); }
}catch(e){ inventory = {}; }
try{
const v2 = localStorage.getItem('droid-tycoon-completed-p34');
if(v2){ completedLevels = JSON.parse(v2); }
}catch(e){ completedLevels = {}; }
render();
}

async function saveInventory(){
document.getElementById('saveNote').textContent = t('saveNoteSaving');
try{
localStorage.setItem('droid-tycoon-inventory-p34', JSON.stringify(inventory));
localStorage.setItem('droid-tycoon-completed-p34', JSON.stringify(completedLevels));
document.getElementById('saveNote').textContent = t('saveNoteSaved');
}catch(e){
document.getElementById('saveNote').textContent = t('saveNoteError');
}
}
function queueSave(){ clearTimeout(saveTimeout); saveTimeout = setTimeout(saveInventory, 400); }

function levelKey(level){ return currentPath + "-" + level; }
function isMarkedDone(level){ return !!completedLevels[levelKey(level)]; }
function toggleDone(level){
const key = levelKey(level);
if(completedLevels[key]) delete completedLevels[key];
else completedLevels[key] = true;
queueSave();
renderMain();
scrollToCurrent();
}

function renderInventory(filter=""){
const list = document.getElementById('inventoryList');
list.innerHTML = "";
droidNames
.filter(n => n.toLowerCase().includes(filter.toLowerCase()))
.forEach(name => {
const row = document.createElement('div');
row.className = 'inv-row';
const label = document.createElement('label');
label.innerHTML = `${name} ${rarityBadge(name)}`;
const select = document.createElement('select');
TIERS.forEach((tLabel,i) => {
const opt = document.createElement('option');
opt.value = i; opt.textContent = tLabel;
if((inventory[name]||0) === i) opt.selected = true;
select.appendChild(opt);
});
select.addEventListener('change', () => {
inventory[name] = parseInt(select.value,10);
queueSave();
renderMain();
});
row.appendChild(label);
row.appendChild(select);
list.appendChild(row);
});
}

function ownedTier(name){ return inventory[name] || 0; }
function isRebirthSatisfied(rb){ return rb.droids.every(([name,tier]) => ownedTier(name) >= tier); }

function renderSellSuggestions(){
const REBIRTHS = PATHS[currentPath];
document.getElementById('txtSellDesc').textContent = t('sellDesc')(currentPath);

const stillNeeded = new Set();
REBIRTHS.forEach(rb => {
if(!isMarkedDone(rb.level)){
rb.droids.forEach(([name]) => stillNeeded.add(name));
}
});

const sellList = document.getElementById('sellList');
sellList.innerHTML = "";

const ownedNames = Object.keys(inventory).filter(name => (inventory[name]||0) > 0);
const sellable = ownedNames.filter(name => !stillNeeded.has(name));

if(ownedNames.length === 0){
sellList.innerHTML = `<div class="save-note">${t('sellEmptyInv')}</div>`;
return;
}
if(sellable.length === 0){
sellList.innerHTML = `<div class="save-note">${t('sellNothing')}</div>`;
return;
}
sellable.forEach(name => {
const tier = inventory[name];
const chip = document.createElement('div');
chip.className = 'need-chip ok';
chip.innerHTML = `🗑️ ${name} <span class="tier-tag ${TIER_CLASS[tier]}">${TIERS[tier]}</span>${rarityBadge(name)}`;
sellList.appendChild(chip);
});
}

function renderMain(){
const REBIRTHS = PATHS[currentPath];
document.getElementById('pathLabel').textContent = "Path " + currentPath;

let currentIdx = REBIRTHS.findIndex(rb => !isMarkedDone(rb.level));
const total = REBIRTHS.length;
const doneCount = currentIdx === -1 ? total : currentIdx;

const currentLevelEl = document.getElementById('currentLevel');
const currentCreditsEl = document.getElementById('currentCredits');
const currentNeedsEl = document.getElementById('currentNeeds');
const progressBar = document.getElementById('progressBar');
const progressText = document.getElementById('progressText');

progressBar.style.width = Math.round((doneCount/total)*100) + "%";
progressText.textContent = t('progressText')(doneCount, total, currentPath);

if(currentIdx === -1){
currentLevelEl.textContent = t('allDone');
currentCreditsEl.textContent = t('allDoneDesc')(total, currentPath);
currentNeedsEl.innerHTML = "";
}else{
const rb = REBIRTHS[currentIdx];
currentLevelEl.textContent = `Rebirth ${rb.level}`;
currentCreditsEl.innerHTML = t('needCredits')(rb.credits) + ' ' + rewardBadge(rb.level);
currentNeedsEl.innerHTML = "";
rb.droids.forEach(([name,tier,reused]) => {
const chip = document.createElement('div');
const ok = ownedTier(name) >= tier;
chip.className = 'need-chip ' + (ok ? 'ok' : 'missing');
chip.innerHTML = `<span>${ok?'✅':'❌'}</span> ${name} <span class="tier-tag ${TIER_CLASS[tier]}">${TIERS[tier]}</span>${rarityBadge(name)}${reused?'<span class="reuse-star">★</span>':''}`;
currentNeedsEl.appendChild(chip);
});
}

const listEl = document.getElementById('rebirthList');
listEl.innerHTML = "";
REBIRTHS.forEach((rb, idx) => {
const done = isMarkedDone(rb.level);
const card = document.createElement('div');
card.className = 'rebirth-card' + (done ? ' done' : '') + (idx === currentIdx ? ' current' : '');

const left = document.createElement('div');
left.className = 'rb-left';

const checkbox = document.createElement('input');
checkbox.type = 'checkbox';
checkbox.checked = done;
checkbox.title = t('checkboxTitle');
checkbox.style.width = '18px';
checkbox.style.height = '18px';
checkbox.style.cursor = 'pointer';
checkbox.addEventListener('change', () => toggleDone(rb.level));
left.appendChild(checkbox);

const num = document.createElement('div');
num.className = 'rb-num';
num.textContent = rb.level;
left.appendChild(num);
const cred = document.createElement('div');
cred.className = 'rb-credits';
cred.textContent = rb.credits;
left.appendChild(cred);
if(REWARDS[rb.level]){
const rw = document.createElement('div');
rw.innerHTML = rewardBadge(rb.level);
left.appendChild(rw.firstChild);
}

const droidsWrap = document.createElement('div');
droidsWrap.className = 'rb-droids';
rb.droids.forEach(([name,tier,reused]) => {
const ok = ownedTier(name) >= tier;
const chip = document.createElement('div');
chip.className = 'need-chip ' + (ok ? 'ok' : 'missing');
chip.innerHTML = `${name} <span class="tier-tag ${TIER_CLASS[tier]}">${TIERS[tier]}</span>${rarityBadge(name)}${reused?'<span class="reuse-star">★</span>':''}<span class="status-icon">${ok?'✅':'❌'}</span>`;
droidsWrap.appendChild(chip);
});

card.appendChild(left);
card.appendChild(droidsWrap);
listEl.appendChild(card);
});

renderSellSuggestions();
}

function pad2(n){ return n < 10 ? '0'+n : ''+n; }

function updateSpawnTimers(){
const now = new Date();
const s = now.getSeconds();
const m = now.getMinutes();

// Beskar: every 15 minutes (:00, :15, :30, :45)
let beskarSecs = ((15 - (m % 15)) * 60) - s;
if(beskarSecs <= 0) beskarSecs += 15*60;
if(m % 15 === 0 && s === 0) beskarSecs = 15*60;

// Mythic: every 60 minutes (top of hour)
let mythicSecs = ((60 - m) * 60) - s;
if(mythicSecs <= 0) mythicSecs += 60*60;

// Galactic: at :45 every hour
let galacticMin = m < 45 ? (45 - m) : (45 + 60 - m);
let galacticSecs = galacticMin * 60 - s;
if(galacticSecs <= 0) galacticSecs += 3600;
if(m === 45 && s === 0) galacticSecs = 3600;

function fmt(totalSecs){
const mm = Math.floor(totalSecs / 60);
const ss = totalSecs % 60;
return pad2(mm) + ':' + pad2(ss);
}

document.getElementById('spawnBeskarLabel').textContent = t('spawnBeskar');
document.getElementById('spawnMythicLabel').textContent = t('spawnMythic');
document.getElementById('spawnGalacticLabel').textContent = t('spawnGalactic');
document.getElementById('spawnBeskarTime').textContent = fmt(beskarSecs);
document.getElementById('spawnMythicTime').textContent = fmt(mythicSecs);
document.getElementById('spawnGalacticTime').textContent = fmt(galacticSecs);
}
setInterval(updateSpawnTimers, 1000);

const DEAL_REPO = 'deznexen/droidmanage';
const DEAL_ISSUE = 1;

async function fetchLimitedDeal(){
const el = document.getElementById('dealContent');
el.textContent = t('dealLoading');
try{
const res = await fetch(`https://api.github.com/repos/${DEAL_REPO}/issues/${DEAL_ISSUE}/comments?sort=created&direction=desc&per_page=1`);
if(!res.ok) throw new Error('bad response');
const comments = await res.json();
if(!comments || comments.length === 0){
el.textContent = t('dealNone');
return;
}
const latest = comments[0];
const createdAt = new Date(latest.created_at);
const minsAgo = Math.max(0, Math.round((Date.now() - createdAt.getTime()) / 60000));
const who = latest.user && latest.user.login ? latest.user.login : '?';
const whenText = minsAgo === 0 ? t('dealReportedByNow')(who) : t('dealReportedBy')(who, minsAgo);
el.innerHTML = `<strong style="color:var(--text);">${latest.body.replace(/</g,'&lt;')}</strong><br>${whenText}`;
}catch(e){
el.textContent = t('dealError');
}
}
setInterval(fetchLimitedDeal, 30000);

document.getElementById('reportDealBtn').addEventListener('click', () => {
window.open(`https://github.com/${DEAL_REPO}/issues/${DEAL_ISSUE}`, '_blank');
});

async function init(){
updateSpawnTimers();
fetchLimitedDeal();
await loadLangPref();
await loadCompactPref();
await loadPathPref();
await loadInventory();
scrollToCurrent();
}
init();
